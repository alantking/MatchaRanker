<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlavorRank - Matcha & Subway Ranker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        matcha: {
                            50: '#f4f7f2',
                            100: '#e5ece1',
                            200: '#cbdac5',
                            300: '#a7c09f',
                            400: '#83a579',
                            500: '#64885a',
                            600: '#4d6d45',
                            700: '#3e5638',
                            800: '#34462f',
                            900: '#2c3b28',
                        },
                        subway: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#008c3a',
                            600: '#00702e',
                            700: '#005723',
                            yellow: '#ffc20d',
                            darkyellow: '#e5ab00',
                        },
                        cream: '#FAF8F5',
                        oat: '#EFECE6',
                        latte: '#E0D8CC',
                        sage: '#A3B19B',
                    },
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #FAF8F5;
            color: #2c3b28;
            -webkit-tap-highlight-color: transparent;
        }
        
        .card-shadow {
            box-shadow: 0 4px 20px -2px rgba(100, 136, 90, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.04);
        }

        .gold-glow {
            box-shadow: 0 0 12px rgba(234, 179, 8, 0.35);
        }

        .drink-chip-active {
            background-color: var(--accent-color, #64885a);
            color: white;
            border-color: var(--accent-color, #64885a);
        }

        .dragging {
            opacity: 0.5;
            transform: scale(0.98);
        }
    </style>
</head>
<body class="min-h-screen pb-24 md:pb-12 bg-cream text-matcha-900 transition-colors duration-300">

    <!-- App Header & Mode Switcher -->
    <header class="sticky top-0 z-30 bg-cream/90 backdrop-blur-md border-b border-oat">
        <div class="max-w-md mx-auto px-4 py-3 space-y-2.5">
            <!-- Top Header Row -->
            <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                    <div id="appLogoBadge" class="w-9 h-9 rounded-full bg-matcha-500 text-cream flex items-center justify-center text-lg shadow-md shrink-0 transition-colors duration-300">
                        🍵
                    </div>
                    <div>
                        <h1 id="appTitleText" class="font-bold text-base leading-tight text-matcha-800">MatchaRank</h1>
                        <p id="appSubtitleText" class="text-[11px] text-matcha-600 font-medium">Spot Rankings</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-2">
                    <button id="addBtn" onclick="openModal()" class="bg-matcha-500 hover:bg-matcha-600 active:scale-95 transition-all text-white font-semibold text-xs py-2 px-3.5 rounded-full flex items-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span id="addBtnLabel">Add Spot</span>
                    </button>
                </div>
            </div>

            <!-- Mode Selector Switcher Tabs -->
            <div class="bg-oat/70 p-1 rounded-2xl flex items-center gap-1 text-xs font-bold border border-latte/50">
                <button id="modeTabMatcha" onclick="switchMode('matcha')" class="flex-1 py-1.5 px-3 rounded-xl flex items-center justify-center gap-1.5 transition-all bg-white text-matcha-800 shadow-sm">
                    <span>🍵</span>
                    <span>Matcha Spots</span>
                </button>
                <button id="modeTabSubway" onclick="switchMode('subway')" class="flex-1 py-1.5 px-3 rounded-xl flex items-center justify-center gap-1.5 transition-all text-matcha-600 hover:text-matcha-900">
                    <span>🥪</span>
                    <span>Subway Ranker</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 pt-4 pb-12">
        
        <!-- Stats & Filter Toolbar -->
        <div class="bg-oat/50 rounded-2xl p-3 border border-oat mb-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-1.5">
                    <span id="totalCountLabel" class="text-xs font-bold uppercase tracking-wider text-matcha-700">Total Ranked:</span>
                    <span id="totalCount" class="bg-matcha-500 text-white text-xs font-bold px-2 py-0.5 rounded-full transition-colors duration-300">0</span>
                </div>
                
                <div class="flex items-center gap-1">
                    <label for="sortSelect" class="text-xs font-medium text-matcha-700">Sort:</label>
                    <select id="sortSelect" onchange="handleSortChange()" class="bg-cream text-xs font-semibold text-matcha-800 rounded-xl px-2 py-1 border border-oat focus:outline-none focus:ring-1 focus:ring-matcha-500 cursor-pointer">
                        <option value="rank">Custom Rank</option>
                        <option value="rating">Highest Rating</option>
                        <option value="name">Alphabetical</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Entries List Container -->
        <div id="rankingsList" class="space-y-3">
            <!-- Dynamic Entry Cards Injected Here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-12 px-4 bg-oat/30 rounded-3xl border border-dashed border-sage/40 my-4">
            <div id="emptyEmoji" class="text-4xl mb-2">🍵</div>
            <h3 id="emptyTitle" class="font-bold text-matcha-800 text-base">No Spots Ranked Yet</h3>
            <p id="emptySubtitle" class="text-xs text-matcha-600 mt-1 max-w-xs mx-auto">Tap "Add" below to rank your very first entry!</p>
            <button id="emptyAddBtn" onclick="openModal()" class="mt-4 bg-matcha-500 text-white text-xs font-semibold py-2 px-4 rounded-full shadow-sm hover:bg-matcha-600 transition-colors">
                + Add First Entry
            </button>
        </div>
    </main>

    <!-- Add / Edit Modal -->
    <div id="entryModal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-end sm:items-center justify-center hidden opacity-0 transition-opacity duration-200">
        <div class="bg-cream w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto transform transition-transform duration-300 translate-y-full sm:translate-y-0">
            <div class="flex items-center justify-between pb-3 border-b border-oat">
                <h2 id="modalTitle" class="font-bold text-base text-matcha-900">Add Entry</h2>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-oat/70 hover:bg-oat text-matcha-800 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="entryForm" onsubmit="handleSaveEntry(event)" class="mt-4 space-y-4">
                <input type="hidden" id="entryId">

                <!-- Item / Location Name -->
                <div>
                    <label id="itemNameLabel" class="block text-xs font-bold uppercase tracking-wider text-matcha-700 mb-1">Spot Name & Location *</label>
                    <input type="text" id="spotName" required placeholder="e.g., Kyoto Tea Bar (SoHo)" class="w-full bg-white text-sm font-medium border border-oat rounded-xl px-3.5 py-2.5 text-matcha-900 placeholder-matcha-400 focus:outline-none focus:ring-2 focus:ring-matcha-500">
                </div>

                <!-- Star Rating -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-matcha-700 mb-1">Rating (1-5 Stars)</label>
                    <div class="flex items-center gap-2 bg-white border border-oat p-2.5 rounded-xl">
                        <div id="starContainer" class="flex gap-1.5 text-xl cursor-pointer">
                            <!-- Dynamic Stars -->
                        </div>
                        <span id="ratingValueText" class="text-xs font-bold text-matcha-700 ml-2">5.0 / 5</span>
                        <input type="hidden" id="spotRating" value="5">
                    </div>
                </div>

                <!-- Tags Selector Section -->
                <div>
                    <label id="tagsSectionLabel" class="block text-xs font-bold uppercase tracking-wider text-matcha-700 mb-1">Drink Types Tried</label>
                    <p id="tagsSectionSubtext" class="text-[11px] text-matcha-600 mb-2">Tap to select options:</p>
                    <div id="tagsSelectorContainer" class="flex flex-wrap gap-2">
                        <!-- Dynamic Tag Chips -->
                    </div>

                    <!-- Custom Tag Input -->
                    <div class="flex gap-2 mt-2.5">
                        <input type="text" id="customTagInput" placeholder="Add custom tag (e.g. Peanut 🥜)" class="flex-1 text-xs bg-white border border-oat rounded-xl px-3 py-2 text-matcha-900 placeholder-matcha-400 focus:outline-none focus:ring-1 focus:ring-matcha-500">
                        <button type="button" onclick="addCustomTag()" class="bg-sage/30 hover:bg-sage/50 text-matcha-800 text-xs font-bold px-3 py-2 rounded-xl transition-colors">
                            + Add Tag
                        </button>
                    </div>
                </div>

                <!-- Modal Actions -->
                <div class="pt-2 flex gap-3">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-oat hover:bg-latte text-matcha-800 font-bold text-xs py-3 rounded-xl transition-colors">
                        Cancel
                    </button>
                    <button id="modalSaveBtn" type="submit" class="flex-1 bg-matcha-500 hover:bg-matcha-600 text-white font-bold text-xs py-3 rounded-xl shadow-md transition-all">
                        Save Entry
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-matcha-800 text-cream text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg z-50 flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300">
        <i class="fa-solid fa-circle-check text-matcha-300"></i>
        <span id="toastMsg font-medium">Notification message</span>
    </div>

    <script>
        // Preset Drink Tags for Matcha Mode
        const MATCHA_PRESETS = [
            { id: 'original', label: 'Original Matcha', icon: '🍵' },
            { id: 'banana', label: 'Banana Matcha', icon: '🍌' },
            { id: 'mango', label: 'Mango Matcha', icon: '🥭' },
            { id: 'passion', label: 'Passion Fruit Matcha', icon: '🥭' },
            { id: 'frappe', label: 'Matcha Frappe / Slush', icon: '🍧' },
            { id: 'strawberry', label: 'Strawberry Matcha', icon: '🍓' },
            { id: 'coconut', label: 'Coconut / Cloud Foam', icon: '🥥' },
            { id: 'warabimochi', label: 'Warabimochi', icon: '🍮' },
            { id: 'peanut', label: 'Peanut Matcha', icon: '🥜' }
        ];

        // Preset Ingredient Tags for Subway Sandwich Mode
        const SUBWAY_PRESETS = [
            // Meats & Proteins
            { id: 'chicken', label: 'Chicken', icon: '🍗' },
            { id: 'ham', label: 'Ham', icon: '🥩' },
            { id: 'turkey', label: 'Turkey', icon: '🦃' },
            { id: 'bacon', label: 'Bacon', icon: '🥓' },
            { id: 'meatballs', label: 'Meatballs', icon: '🧆' },
            { id: 'tuna', label: 'Tuna', icon: '🐟' },
            // Cheeses
            { id: 'cheese', label: 'Cheese', icon: '🧀' },
            // Veggies & Toppings
            { id: 'lettuce', label: 'Lettuce', icon: '🥬' },
            { id: 'tomato', label: 'Tomato', icon: '🍅' },
            { id: 'onion', label: 'Red Onion', icon: '🧅' },
            { id: 'pepper', label: 'Green Peppers', icon: '🫑' },
            { id: 'jalapenos', label: 'Jalapeños', icon: '🌶️' },
            { id: 'bananapeppers', label: 'Banana Peppers', icon: '💛' },
            { id: 'cucumbers', label: 'Cucumbers', icon: '🥒' },
            { id: 'olives', label: 'Black Olives', icon: '🫒' },
            { id: 'pickles', label: 'Pickles', icon: '🥒' },
            { id: 'avocado', label: 'Avocado', icon: '🥑' },
            // Sauces & Condiments
            { id: 'teriyaki', label: 'Teriyaki Sauce', icon: '🥢' },
            { id: 'sweetonion', label: 'Sweet Onion Sauce', icon: '🧅' },
            { id: 'chipotle', label: 'Chipotle Southwest', icon: '🧡' },
            { id: 'ranch', label: 'Ranch', icon: '🥛' },
            { id: 'mustard', label: 'Mustard', icon: '🟡' },
            { id: 'mayo', label: 'Mayo', icon: '⚪' },
            { id: 'hotsauce', label: 'Hot Sauce', icon: '🌶️️' },
            { id: 'oilvinegar', label: 'Oil & Vinegar', icon: '🍾' },
            { id: 'saltpepper', label: 'Salt & Pepper', icon: '🧂' }
        ];

        // Default Sample Data for Matcha
        const MATCHA_SAMPLE = [
            { id: 'm1', rank: 1, name: 'Paragon Tea Room', rating: 5.0, tags: ['Passion Fruit Matcha', 'Matcha Frappe / Slush'] },
            { id: 'm2', rank: 2, name: 'Unscripted', rating: 4.5, tags: ['Coconut / Cloud Foam'] },
            { id: 'm3', rank: 3, name: 'Slo Coffee', rating: 4.2, tags: ['Pistachio Matcha'] },
            { id: 'm4', rank: 4, name: 'Nizu', rating: 4.0, tags: ['Banana Matcha', 'Original Matcha'] },
            { id: 'm5', rank: 5, name: 'The Bee\'s Knees Coffee', rating: 3.5, tags: ['Mango Matcha'] },
            { id: 'm6', rank: 6, name: 'Nana\'s Green Tea', rating: 3.0, tags: ['Matcha Frappe / Slush', 'Warabimochi Matcha'] }
        ];

        // Default Sample Data for Subway
        const SUBWAY_SAMPLE = [
            { id: 's1', rank: 1, name: 'Alan\'s Subway', rating: 5.0, tags: ['Ham', 'Bacon','Turkey','Cheese','Lettuce','Tomato','Cucumbers','Mustard', 'Mayo'] },
            { id: 's2', rank: 2, name: 'Court\'s Subway', rating: 4.7, tags: ['Turkey','Cheese','Lettuce','Tomato','Cucumbers','Red Onion', 'Banana Peppers','Pickles', 'Mustard','Mayo'] },
            { id: 's3', rank: 3, name: 'Alan\'s Tiktok Way', rating: 4.0, tags: ['Ham', 'Bacon','Turkey','Cheese','Lettuce','Tomato', 'Banana Peppers', 'Chipotle Southwest','Ranch'] },
            { id: 's4', rank: 4, name: 'Court\'s Tiktok Way', rating: 3.0, tags: ['chicken', 'Cheese', 'Lettuce', 'Tomato','Jalapeños','Hot Sauce','Sweet Onion Sauce'] }
        ];

        // Active State Variables
        let currentMode = 'matcha'; // 'matcha' or 'subway'
        let matchaEntries = [];
        let subwayEntries = [];
        let selectedTags = [];
        let currentSort = 'rank';
        let draggedIndex = null;

        // Initialize App on DOM Load
        window.addEventListener('DOMContentLoaded', () => {
            loadAllData();
            renderModeUI();
            renderApp();
        });

        function loadAllData() {
            const cachedMatcha = localStorage.getItem('matcha_rankings_list');
            if (cachedMatcha) {
                try { matchaEntries = JSON.parse(cachedMatcha); } catch(e) { matchaEntries = [...MATCHA_SAMPLE]; }
            } else {
                matchaEntries = [...MATCHA_SAMPLE];
            }

            const cachedSubway = localStorage.getItem('subway_rankings_list');
            if (cachedSubway) {
                try { subwayEntries = JSON.parse(cachedSubway); } catch(e) { subwayEntries = [...SUBWAY_SAMPLE]; }
            } else {
                subwayEntries = [...SUBWAY_SAMPLE];
            }
        }

        function saveCurrentModeData() {
            if (currentMode === 'matcha') {
                localStorage.setItem('matcha_rankings_list', JSON.stringify(matchaEntries));
            } else {
                localStorage.setItem('subway_rankings_list', JSON.stringify(subwayEntries));
            }
        }

        function getCurrentEntries() {
            return currentMode === 'matcha' ? matchaEntries : subwayEntries;
        }

        function setCurrentEntries(newEntries) {
            if (currentMode === 'matcha') {
                matchaEntries = newEntries;
            } else {
                subwayEntries = newEntries;
            }
            saveCurrentModeData();
        }

        function switchMode(mode) {
            if (currentMode === mode) return;
            currentMode = mode;
            renderModeUI();
            renderApp();
        }

        function renderModeUI() {
            const isMatcha = currentMode === 'matcha';

            // Logo & Title
            document.getElementById('appLogoBadge').textContent = isMatcha ? '🍵' : '🥪';
            document.getElementById('appLogoBadge').className = `w-9 h-9 rounded-full text-cream flex items-center justify-center text-lg shadow-md shrink-0 transition-colors duration-300 ${isMatcha ? 'bg-matcha-500' : 'bg-subway-500'}`;
            
            document.getElementById('appTitleText').textContent = isMatcha ? 'MatchaRank' : 'SubwayRank';
            document.getElementById('appSubtitleText').textContent = isMatcha ? 'Spot Rankings' : 'Sandwich Rankings';

            // Buttons & Accent Colors
            document.getElementById('addBtn').className = `${isMatcha ? 'bg-matcha-500 hover:bg-matcha-600' : 'bg-subway-500 hover:bg-subway-600'} active:scale-95 transition-all text-white font-semibold text-xs py-2 px-3.5 rounded-full flex items-center gap-1.5 shadow-sm`;
            document.getElementById('addBtnLabel').textContent = isMatcha ? 'Add Spot' : 'Add Sandwich';
            
            document.getElementById('totalCount').className = `${isMatcha ? 'bg-matcha-500' : 'bg-subway-500'} text-white text-xs font-bold px-2 py-0.5 rounded-full transition-colors duration-300`;

            // Tabs Styling
            const matchaTab = document.getElementById('modeTabMatcha');
            const subwayTab = document.getElementById('modeTabSubway');

            if (isMatcha) {
                matchaTab.className = "flex-1 py-1.5 px-3 rounded-xl flex items-center justify-center gap-1.5 transition-all bg-white text-matcha-800 shadow-sm";
                subwayTab.className = "flex-1 py-1.5 px-3 rounded-xl flex items-center justify-center gap-1.5 transition-all text-matcha-600 hover:text-matcha-900";
            } else {
                subwayTab.className = "flex-1 py-1.5 px-3 rounded-xl flex items-center justify-center gap-1.5 transition-all bg-white text-subway-700 shadow-sm";
                matchaTab.className = "flex-1 py-1.5 px-3 rounded-xl flex items-center justify-center gap-1.5 transition-all text-matcha-600 hover:text-matcha-900";
            }

            // Modal Labels
            document.getElementById('itemNameLabel').textContent = isMatcha ? 'Spot Name & Location *' : 'Sandwich Name *';
            document.getElementById('spotName').placeholder = isMatcha ? 'e.g., Kyoto Tea Bar (SoHo)' : 'e.g., Sweet Onion Chicken Teriyaki';
            
            document.getElementById('tagsSectionLabel').textContent = isMatcha ? 'Drink Types Tried' : 'Ingredients & Toppings Used';
            document.getElementById('tagsSectionSubtext').textContent = isMatcha ? 'Tap to select drink varieties:' : 'Tap ingredients used on this sandwich:';
            document.getElementById('customTagInput').placeholder = isMatcha ? 'Add custom tag (e.g. Peanut 🥜)' : 'Add custom ingredient (e.g. Garlic Mayo 🧄)';

            document.getElementById('modalSaveBtn').className = `flex-1 ${isMatcha ? 'bg-matcha-500 hover:bg-matcha-600' : 'bg-subway-500 hover:bg-subway-600'} text-white font-bold text-xs py-3 rounded-xl shadow-md transition-all`;
            document.getElementById('emptyAddBtn').className = `mt-4 ${isMatcha ? 'bg-matcha-500 hover:bg-matcha-600' : 'bg-subway-500 hover:bg-subway-600'} text-white text-xs font-semibold py-2 px-4 rounded-full shadow-sm transition-colors`;
            
            // Empty State texts
            document.getElementById('emptyEmoji').textContent = isMatcha ? '🍵' : '🥪';
            document.getElementById('emptyTitle').textContent = isMatcha ? 'No Matcha Spots Yet' : 'No Sandwiches Ranked Yet';
            document.getElementById('emptySubtitle').textContent = isMatcha ? 'Tap "Add Spot" to begin ranking your favorite matcha places!' : 'Tap "Add Sandwich" to rank your favorite Subway creations!';
        }

        function renderApp() {
            renderList();
            const entries = getCurrentEntries();
            document.getElementById('totalCount').textContent = entries.length;
        }

        function getIconForTag(tag) {
            const presets = currentMode === 'matcha' ? MATCHA_PRESETS : SUBWAY_PRESETS;
            const found = presets.find(p => tag.toLowerCase().includes(p.id) || tag.toLowerCase().includes(p.label.toLowerCase()) || p.label.toLowerCase().includes(tag.toLowerCase()));
            if (found) return found.icon;
            return currentMode === 'matcha' ? '✨' : '🥖';
        }

        function renderList() {
            const listEl = document.getElementById('rankingsList');
            const emptyEl = document.getElementById('emptyState');
            const entries = getCurrentEntries();

            if (entries.length === 0) {
                listEl.innerHTML = '';
                emptyEl.classList.remove('hidden');
                return;
            }

            emptyEl.classList.add('hidden');

            // Sort array copy based on user selection
            let displayList = [...entries];
            if (currentSort === 'rank') {
                displayList.sort((a, b) => a.rank - b.rank);
            } else if (currentSort === 'rating') {
                displayList.sort((a, b) => b.rating - a.rating);
            } else if (currentSort === 'name') {
                displayList.sort((a, b) => a.name.localeCompare(b.name));
            }

            listEl.innerHTML = displayList.map((item, index) => {
                const isCustomSort = currentSort === 'rank';
                const isFirst = index === 0 && isCustomSort;
                const isSecond = index === 1 && isCustomSort;
                const isThird = index === 2 && isCustomSort;

                let rankBadgeBg = 'bg-matcha-100 text-matcha-800';
                if (isFirst) rankBadgeBg = 'bg-yellow-400 text-yellow-950 font-bold gold-glow';
                else if (isSecond) rankBadgeBg = 'bg-slate-200 text-slate-800 font-bold';
                else if (isThird) rankBadgeBg = 'bg-amber-100 text-amber-900 font-bold';

                return `
                    <div 
                        data-id="${item.id}"
                        data-index="${index}"
                        draggable="${isCustomSort ? 'true' : 'false'}"
                        class="card-shadow bg-white rounded-2xl p-3.5 border border-oat relative transition-all duration-200 hover:border-matcha-300"
                    >
                        <div class="flex items-center gap-3">
                            
                            <!-- Left: Rank Badge & Move Controls -->
                            <div class="flex flex-col items-center justify-center gap-1 shrink-0">
                                <div class="w-8 h-8 rounded-xl ${rankBadgeBg} flex items-center justify-center font-bold text-xs shadow-2xs">
                                    #${index + 1}
                                </div>
                                
                                ${isCustomSort ? `
                                    <div class="flex flex-col gap-0.5">
                                        <button onclick="moveRank('${item.id}', -1)" title="Move Up" class="w-6 h-5 rounded bg-oat/50 hover:bg-matcha-100 text-matcha-700 flex items-center justify-center text-[10px] active:scale-90 transition-transform ${index === 0 ? 'opacity-25 cursor-not-allowed' : ''}" ${index === 0 ? 'disabled' : ''}>
                                            <i class="fa-solid fa-chevron-up"></i>
                                        </button>
                                        <button onclick="moveRank('${item.id}', 1)" title="Move Down" class="w-6 h-5 rounded bg-oat/50 hover:bg-matcha-100 text-matcha-700 flex items-center justify-center text-[10px] active:scale-90 transition-transform ${index === displayList.length - 1 ? 'opacity-25 cursor-not-allowed' : ''}" ${index === displayList.length - 1 ? 'disabled' : ''}>
                                            <i class="fa-solid fa-chevron-down"></i>
                                        </button>
                                    </div>
                                ` : ''}
                            </div>

                            <!-- Center: Entry Details -->
                            <div class="flex-1 min-w-0">
                                <div class="flex items-start justify-between gap-2">
                                    <div class="min-w-0">
                                        <h3 class="font-bold text-sm text-matcha-900 truncate leading-snug">${escapeHtml(item.name)}</h3>
                                        <div class="flex items-center gap-1.5 mt-0.5">
                                            <div class="flex text-amber-400 text-xs">
                                                ${renderStarsHTML(item.rating)}
                                            </div>
                                            <span class="text-xs font-bold text-matcha-700">${item.rating.toFixed(1)}</span>
                                        </div>
                                    </div>

                                    <!-- Action Buttons -->
                                    <div class="flex items-center gap-1 shrink-0">
                                        <button onclick="openModal('${item.id}')" title="Edit" class="w-7 h-7 rounded-lg text-matcha-600 hover:bg-matcha-50 flex items-center justify-center text-xs transition-colors">
                                            <i class="fa-solid fa-pen"></i>
                                        </button>
                                        <button onclick="deleteEntry('${item.id}')" title="Delete" class="w-7 h-7 rounded-lg text-rose-500 hover:bg-rose-50 flex items-center justify-center text-xs transition-colors">
                                            <i class="fa-solid fa-trash-can"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- Ingredient / Drink Tags -->
                                ${item.tags && item.tags.length > 0 ? `
                                    <div class="flex flex-wrap gap-1.5 mt-2">
                                        ${item.tags.map(tag => `
                                            <span class="bg-oat/60 text-matcha-800 text-[11px] font-semibold px-2 py-0.5 rounded-lg border border-latte/40 flex items-center gap-1">
                                                <span>${getIconForTag(tag)}</span> ${escapeHtml(tag)}
                                            </span>
                                        `).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            if (currentSort === 'rank') {
                attachDragAndDropHandlers();
            }
        }

        function attachDragAndDropHandlers() {
            const cards = document.querySelectorAll('#rankingsList > div');
            cards.forEach(card => {
                card.addEventListener('dragstart', (e) => {
                    draggedIndex = parseInt(card.getAttribute('data-index'));
                    card.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                });

                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging');
                });

                card.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                });

                card.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const targetIndex = parseInt(card.getAttribute('data-index'));
                    if (draggedIndex !== null && draggedIndex !== targetIndex) {
                        reorderEntries(draggedIndex, targetIndex);
                    }
                });
            });
        }

        function reorderEntries(fromIdx, toIdx) {
            let entries = getCurrentEntries();
            entries.sort((a, b) => a.rank - b.rank);
            const [movedItem] = entries.splice(fromIdx, 1);
            entries.splice(toIdx, 0, movedItem);

            entries.forEach((item, idx) => {
                item.rank = idx + 1;
            });

            setCurrentEntries(entries);
            renderApp();
            showToast("Rankings reordered! 📊");
        }

        function moveRank(id, direction) {
            let entries = getCurrentEntries();
            entries.sort((a, b) => a.rank - b.rank);
            const idx = entries.findIndex(e => e.id === id);
            if (idx === -1) return;

            const targetIdx = idx + direction;
            if (targetIdx < 0 || targetIdx >= entries.length) return;

            reorderEntries(idx, targetIdx);
        }

        function renderStarsHTML(rating) {
            let stars = '';
            for (let i = 1; i <= 5; i++) {
                if (rating >= i) {
                    stars += `<i class="fa-solid fa-star"></i>`;
                } else if (rating >= i - 0.5) {
                    stars += `<i class="fa-solid fa-star-half-stroke"></i>`;
                } else {
                    stars += `<i class="fa-regular fa-star text-latte"></i>`;
                }
            }
            return stars;
        }

        function setupStarRating(initialValue = 5) {
            const container = document.getElementById('starContainer');
            const hiddenInput = document.getElementById('spotRating');
            const ratingText = document.getElementById('ratingValueText');

            hiddenInput.value = initialValue;
            ratingText.textContent = `${parseFloat(initialValue).toFixed(1)} / 5`;

            let html = '';
            for (let i = 1; i <= 5; i++) {
                html += `<i data-star="${i}" class="fa-solid fa-star ${i <= initialValue ? 'text-amber-400' : 'text-latte'} transition-colors"></i>`;
            }
            container.innerHTML = html;

            const stars = container.querySelectorAll('[data-star]');
            stars.forEach(star => {
                star.addEventListener('click', () => {
                    const val = parseFloat(star.getAttribute('data-star'));
                    hiddenInput.value = val;
                    ratingText.textContent = `${val.toFixed(1)} / 5`;
                    
                    stars.forEach((s, idx) => {
                        if (idx + 1 <= val) {
                            s.className = 'fa-solid fa-star text-amber-400 transition-colors';
                        } else {
                            s.className = 'fa-solid fa-star text-latte transition-colors';
                        }
                    });
                });
            });
        }

        function openModal(editId = null) {
            const modal = document.getElementById('entryModal');
            const modalTitle = document.getElementById('modalTitle');
            const form = document.getElementById('entryForm');
            const entries = getCurrentEntries();

            form.reset();
            selectedTags = [];

            const isMatcha = currentMode === 'matcha';

            if (editId) {
                const item = entries.find(e => e.id === editId);
                if (item) {
                    modalTitle.textContent = isMatcha ? 'Edit Matcha Spot' : 'Edit Subway Sandwich';
                    document.getElementById('entryId').value = item.id;
                    document.getElementById('spotName').value = item.name;
                    selectedTags = item.tags ? [...item.tags] : [];
                    setupStarRating(item.rating);
                }
            } else {
                modalTitle.textContent = isMatcha ? 'Add Matcha Spot' : 'Add Subway Sandwich';
                document.getElementById('entryId').value = '';
                setupStarRating(5);
            }

            renderTagSelector();

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.firstElementChild.classList.remove('translate-y-full');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('entryModal');
            modal.classList.add('opacity-0');
            modal.firstElementChild.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function renderTagSelector() {
            const container = document.getElementById('tagsSelectorContainer');
            const presets = currentMode === 'matcha' ? MATCHA_PRESETS : SUBWAY_PRESETS;
            const activeBgClass = currentMode === 'matcha' ? 'bg-matcha-500 border-matcha-500 text-white' : 'bg-subway-500 border-subway-500 text-white';

            const allTagLabels = [...presets.map(p => p.label)];
            selectedTags.forEach(tag => {
                if (!allTagLabels.includes(tag)) {
                    allTagLabels.push(tag);
                }
            });

            container.innerHTML = allTagLabels.map(tagLabel => {
                const isSelected = selectedTags.includes(tagLabel);
                const icon = getIconForTag(tagLabel);

                return `
                    <button type="button" onclick="toggleTag('${escapeHtml(tagLabel)}')" class="text-xs font-semibold px-2.5 py-1.5 rounded-xl border transition-all flex items-center gap-1.5 ${isSelected ? `${activeBgClass} shadow-2xs` : 'bg-white text-matcha-800 border-oat hover:border-matcha-300'}">
                        <span>${icon}</span>
                        <span>${escapeHtml(tagLabel)}</span>
                        ${isSelected ? '<i class="fa-solid fa-check text-[10px] ml-0.5"></i>' : ''}
                    </button>
                `;
            }).join('');
        }

        function toggleTag(tagLabel) {
            const idx = selectedTags.indexOf(tagLabel);
            if (idx > -1) {
                selectedTags.splice(idx, 1);
            } else {
                selectedTags.push(tagLabel);
            }
            renderTagSelector();
        }

        function addCustomTag() {
            const input = document.getElementById('customTagInput');
            const val = input.value.trim();
            if (val) {
                if (!selectedTags.includes(val)) {
                    selectedTags.push(val);
                }
                input.value = '';
                renderTagSelector();
            }
        }

        function handleSaveEntry(e) {
            e.preventDefault();

            const id = document.getElementById('entryId').value;
            const name = document.getElementById('spotName').value.trim();
            const rating = parseFloat(document.getElementById('spotRating').value) || 5;

            if (!name) return;

            let entries = getCurrentEntries();

            if (id) {
                const item = entries.find(e => e.id === id);
                if (item) {
                    item.name = name;
                    item.rating = rating;
                    item.tags = [...selectedTags];
                }
                showToast("Entry updated! ✨");
            } else {
                const newRank = entries.length + 1;
                const newEntry = {
                    id: (currentMode === 'matcha' ? 'm_' : 's_') + Date.now(),
                    rank: newRank,
                    name,
                    rating,
                    tags: [...selectedTags]
                };
                entries.push(newEntry);
                showToast(currentMode === 'matcha' ? "New spot added! 🍵" : "New sandwich added! 🥪");
            }

            setCurrentEntries(entries);
            renderApp();
            closeModal();
        }

        function deleteEntry(id) {
            let entries = getCurrentEntries();
            const item = entries.find(e => e.id === id);
            if (!item) return;

            entries = entries.filter(e => e.id !== id);
            entries.sort((a, b) => a.rank - b.rank);
            entries.forEach((entry, idx) => {
                entry.rank = idx + 1;
            });

            setCurrentEntries(entries);
            renderApp();
            showToast("Item removed 🗑️");
        }

        function handleSortChange() {
            currentSort = document.getElementById('sortSelect').value;
            renderList();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = msg;
            
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
</body>
</html>
